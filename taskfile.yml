# https://taskfile.dev

version: "3"

includes:
  aoc: taskfiles/aoc.yml

tasks:
  init-git-repo:
    cmds:
      - git init
    status:
      - test -d .git
    internal: true

  create-env-file:
    cmds:
      - cp .env.example .env
    status:
      - test -f .env
    internal: true

  create-data-dir:
    cmds:
      - mkdir -p data
    status:
      - test -d data
    internal: true

  create-token-dir:
    cmds:
      - mkdir -p ~/.config/aocd
    status:
      - test -d ~/.config/aocd
    internal: true

  install-pre-commit:
    cmds:
      - uv tool install pre-commit
      - uv tool run pre-commit install
    status:
      - test -f .git/hooks/pre-commit
    internal: true

  setup:
    cmds:
      - task: init-git-repo
      - task: create-env-file
      - task: create-data-dir
      - task: create-token-dir
      - task: install-pre-commit
      - uv sync --all-groups --all-extras
    desc: Setup development environment

  lint:
    cmds:
      - uv tool run pre-commit run --all-files
    desc: Run linters

  test:
    cmds:
      - uv run pytest
    desc: Run tests

  bump-version:
    cmds:
      - uv version --bump {{.VERSION}}
      - git tag v$(uv version --short)
    requires:
      vars:
        - name: VERSION
          enum: [patch, minor, major]
    desc: Bump project version
